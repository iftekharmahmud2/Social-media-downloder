<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Video Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0f19; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 480px; background: #161f30; border: 1px solid #243048; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    h1 { font-size: 1.5rem; margin-bottom: 8px; text-align: center; color: #f8fafc; }
    p.subtitle { font-size: 0.88rem; color: #94a3b8; text-align: center; margin-bottom: 20px; }
    .input-group { display: flex; flex-direction: column; gap: 12px; }
    input[type="text"] { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #2d3b55; background: #0f1624; color: #fff; font-size: 0.95rem; outline: none; }
    input[type="text"]:focus { border-color: #3b82f6; }
    button.fetch-btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #3b82f6; color: #ffffff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button.fetch-btn:hover { background: #2563eb; }
    button.fetch-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #previewArea { margin-top: 20px; display: none; flex-direction: column; align-items: center; text-align: center; }
    video { width: 100%; max-height: 320px; border-radius: 10px; margin-bottom: 14px; background: #000; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .action-btn { display: block; width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; text-decoration: none; text-align: center; font-size: 0.95rem; }
    .btn-direct { background: #10b981; color: white; }
    .btn-direct:hover { background: #059669; }
    .hint { font-size: 0.8rem; color: #94a3b8; margin-top: 8px; line-height: 1.4; }
    #errorMsg { margin-top: 16px; color: #ef4444; font-size: 0.88rem; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Video Downloader</h1>
    <p class="subtitle">Download videos directly from FB, IG, and others</p>
    <div class="input-group">
      <input type="text" id="urlInput" placeholder="Paste link here..." />
      <button class="fetch-btn" id="fetchBtn" onclick="processVideo()">Fetch Video</button>
    </div>
    <div id="errorMsg"></div>
    <div id="previewArea">
      <video id="videoPreview" controls playsinline></video>
      <div class="btn-group">
        <a class="action-btn btn-direct" id="openVideoBtn" href="#" target="_blank">Open / Save Video</a>
      </div>
      <p class="hint">টিপস: ভিডিও চালু হলে প্লেয়ারের ডানপাশের <b>৩ ডট (⋮)</b> চেপে সরাসরি <b>Download</b> এ ট্যাপ করুন।</p>
    </div>
  </div>

  <script>
    async function processVideo() {
      const urlInput = document.getElementById('urlInput');
      const fetchBtn = document.getElementById('fetchBtn');
      const errorMsg = document.getElementById('errorMsg');
      const previewArea = document.getElementById('previewArea');
      const videoPreview = document.getElementById('videoPreview');
      const openVideoBtn = document.getElementById('openVideoBtn');

      const url = urlInput.value.trim();
      if (!url) return;

      errorMsg.style.display = 'none';
      previewArea.style.display = 'none';
      fetchBtn.disabled = true;
      fetchBtn.textContent = 'Processing...';

      try {
        // Direct public extractor API that handles social links without login
        const apiUrl = 'https://api.vkrdownloader.com/v1/get?url=' + encodeURIComponent(url);
        const res = await fetch(apiUrl);
        const data = await res.json();

        let finalVideoUrl = null;

        if (data && data.data && data.data.downloads && data.data.downloads.length > 0) {
          finalVideoUrl = data.data.downloads[0].url;
        } else if (data && data.url) {
          finalVideoUrl = data.url;
        }

        if (!finalVideoUrl) {
          throw new Error('Could not find streamable video URL.');
        }

        videoPreview.src = finalVideoUrl;
        openVideoBtn.href = finalVideoUrl;
        previewArea.style.display = 'flex';
      } catch (err) {
        errorMsg.textContent = 'Error: Link is private or format unsupported. Try another public post.';
        errorMsg.style.display = 'block';
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.textContent = 'Fetch Video';
      }
    }
  </script>
</body>
</html>
